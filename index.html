  function selectNode(node) {
    try {
      var range = document.createRange();
      range.selectNodeContents(node);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    } catch (e) {}
  }
  document.addEventListener('click', function (ev) {
    var btn = ev.target.closest && ev.target.closest('[data-copy]');
    if (!btn) return;
    var target = document.getElementById(btn.getAttribute('data-target'));
    var hint = document.getElementById('copy-hint');
    copyText(btn.getAttribute('data-copy')).then(function (ok) {
      var label = btn.getAttribute('data-label') || btn.textContent;
      btn.setAttribute('data-label', label);
      btn.textContent = ok ? 'Copiato' : 'Selezionato';
      btn.classList.toggle('is-done', ok);
      if (!ok && target) selectNode(target);
      if (hint) {
        hint.hidden = ok;
        hint.textContent = ok ? '' : 'Il tuo browser non permette la copia automatica. Il testo è selezionato: tieni premuto e scegli Copia.';
      }
      setTimeout(function () {
        btn.textContent = label;
        btn.classList.remove('is-done');
      }, 2200);
    });
  });

  /* ---------- zona segreta: 5 tocchi sul pettorale ---------- */
  var canEdit = false;
  var artifactApi = null;
  var tapN = 0, tapT = 0;

  document.addEventListener('click', function (ev) {
    if (!(ev.target.closest && ev.target.closest('.bib'))) return;
    var now = Date.now();
    tapN = (now - tapT < 700) ? tapN + 1 : 1;
    tapT = now;
    if (tapN >= 5) { tapN = 0; openAdmin(); }
  });

  (async function () {
    try {
      if (window.claude && window.claude.use) {
        var u = await window.claude.use('user');
        if (u) canEdit = await u.canEdit();
        artifactApi = await window.claude.use('artifact');
        if (canEdit && location.hash === '#gestione') openAdmin();
      }
    } catch (e) {}
  })();

  function buildDoc(s) {
    var keep = [].map.call(document.querySelectorAll('[data-keep]'), function (n) { return n.outerHTML; }).join('\n');
    var appJs = document.querySelector('script[data-app]').textContent;
    var st = JSON.stringify(s).replace(/</g, '\\u003c');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>\n' +
      keep + '\n\n<main class="page" id="app">' + view(s) + '</main>\n\n' +
      '<script type="application/json" id="state">' + st + '<\/script>\n\n' +
      '<script data-app>' + appJs + '<\/script>\n\n</body></html>';
  }

  var panel = null, draft = null;

  function openAdmin() {
    if (!canEdit || panel) return;
    draft = JSON.parse(JSON.stringify(state));
    panel = document.createElement('div');
    panel.className = 'adm-back';
    panel.innerHTML =
      '<div class="adm-card" role="dialog" aria-modal="true" aria-labelledby="adm-title">' +
        '<h2 id="adm-title">Gestione conta</h2>' +
        '<p class="adm-total" id="adm-total"></p>' +
        '<ul class="adm-list" id="adm-list"></ul>' +
        '<form class="adm-form" id="adm-form" autocomplete="off">' +
          '<div class="adm-grid">' +
            '<label class="adm-f"><span class="label">Nome</span><input class="in" id="adm-name" type="text" maxlength="60"></label>' +
            '<label class="adm-f"><span class="label">Importo €</span><input class="in" id="adm-amount" type="text" inputmode="decimal"></label>' +
          '</div>' +
          '<label class="adm-check"><input id="adm-anon" type="checkbox"> Anonimo (il nome non viene salvato)</label>' +
          '<button class="btn" type="submit">Aggiungi contributo</button>' +
        '</form>' +
        '<label class="adm-f"><span class="label">Obiettivo €</span><input class="in" id="adm-goal" type="text" inputmode="decimal"></label>' +
        '<p class="msg" id="adm-msg" role="status"></p>' +
        '<div class="adm-actions"><button class="btn" type="button" id="adm-close">Chiudi</button>' +
        '<button class="btn primary" type="button" id="adm-save">Salva e pubblica</button></div>' +
      '</div>';
    document.body.appendChild(panel);

    var $ = function (id) { return document.getElementById(id); };
    $('adm-goal').value = String(draft.goal).replace('.', ',');

    function msg(t) { $('adm-msg').textContent = t || ''; }
    function drawList() {
      $('adm-total').textContent = 'Totale ' + fmt(total(draft)) + ' su ' + fmt(draft.goal);
      var ul = $('adm-list');
      ul.innerHTML = '';
      draft.entries.forEach(function (e) {
        var li = document.createElement('li');
        var who = document.createElement('span'); who.className = 'adm-who'; who.textContent = shownName(e);
        var sum = document.createElement('span'); sum.className = 'adm-sum'; sum.textContent = fmt(e.amount);
        var del = document.createElement('button'); del.type = 'button'; del.className = 'btn small'; del.textContent = 'Rimuovi';
        del.setAttribute('aria-label', 'Rimuovi ' + shownName(e));
        del.addEventListener('click', function () {
          draft.entries = draft.entries.filter(function (x) { return x.id !== e.id; });
          drawList();
        });
        li.appendChild(who); li.appendChild(sum); li.appendChild(del);
        ul.appendChild(li);
      });
    }
    drawList();

    function close() {
      document.removeEventListener('keydown', onKey);
      panel.remove(); panel = null;
    }
    function onKey(ev) { if (ev.key === 'Escape') close(); }
    document.addEventListener('keydown', onKey);
    $('adm-close').addEventListener('click', close);

    $('adm-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var anon = $('adm-anon').checked;
      var name = $('adm-name').value.trim();
      var amount = parseAmount($('adm-amount').value);
      if (!(amount > 0)) { msg('Scrivi un importo maggiore di zero.'); return; }
      if (!anon && !name) { msg('Scrivi un nome oppure spunta Anonimo.'); return; }
      draft.entries.push({ id: 'e' + Date.now(), name: anon ? '' : name, anon: anon, amount: amount });
      $('adm-name').value = ''; $('adm-amount').value = ''; $('adm-anon').checked = false;
      msg('Aggiunto. Ora premi Salva e pubblica.');
      drawList();
      $('adm-name').focus();
    });

    $('adm-save').addEventListener('click', async function () {
      var goal = parseAmount($('adm-goal').value);
      if (!(goal > 0)) { msg('L\'obiettivo deve essere un importo maggiore di zero.'); return; }
      if (!artifactApi) { msg('Il salvataggio non è disponibile in questa vista.'); return; }
      draft.goal = goal;
      var btn = $('adm-save');
      btn.disabled = true; msg('Salvataggio in corso…');
      try {
        await artifactApi.publish(buildDoc(draft));
        msg('Salvato. La pagina si aggiorna.');
      } catch (e) {
        btn.disabled = false;
        var c = e && e.code;
        if (c === 'conflict') msg('Un\'altra modifica è stata salvata prima: la pagina si sta aggiornando, poi riprova.');
        else if (c === 'not_writer' || c === 'not_granted') msg('Solo chi ha creato la pagina può modificare la conta.');
        else if (c === 'rate_limited') msg('Troppi salvataggi ravvicinati, aspetta qualche secondo.');
        else msg('Salvataggio non riuscito. Riprova tra poco.');
      }
    });
    $('adm-name').focus();
  }
})();
</script>

</body></html>
