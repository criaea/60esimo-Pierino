<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>60esimo Pierino</title>
<meta name="description" content="Colletta per il regalo del 60esimo compleanno di Pierino: una bicicletta elettrica.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: titolo in alto, storia a sinistra, scheda "come contribuire" fissa a destra (su telefono subito sotto il titolo).
   Idea visiva: il pettorale da ciclista con il 60, rosa come una maglia da corsa, su fondo verde-grigio da strada. */
:root {
  --bg: #F2F5F2;
  --surface: #FFFFFF;
  --panel: #DCE6E0;
  --ink: #13211C;
  --muted: #55645E;
  --line: #D3DCD7;
  --accent: #F2679A;
  --accent-soft: #FADCE8;
  --btn-bg: #13211C;
  --btn-fg: #FFFFFF;
  --focus: #1B5FD1;
  --bib: #FFFFFF;
  --bib-ink: #13211C;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1512;
    --surface: #16211C;
    --panel: #1B2A24;
    --ink: #E9F1EC;
    --muted: #9CB0A7;
    --line: #29382F;
    --accent-soft: #3A1B29;
    --btn-bg: #E9F1EC;
    --btn-fg: #0E1512;
    --focus: #8DB8FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1512;
  --surface: #16211C;
  --panel: #1B2A24;
  --ink: #E9F1EC;
  --muted: #9CB0A7;
  --line: #29382F;
  --accent-soft: #3A1B29;
  --btn-bg: #E9F1EC;
  --btn-fg: #0E1512;
  --focus: #8DB8FF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

.page {
  max-width: 1040px;
  margin-inline: auto;
  display: grid;
  gap: 28px 44px;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "head" "hero" "pay" "story" "gallery" "donors" "foot";
}
@media (min-width: 880px) {
  .page {
    grid-template-columns: minmax(0, 1fr) 380px;
    grid-template-areas:
      "head head"
      "hero pay"
      "story pay"
      "gallery pay"
      "donors pay"
      "foot foot";
  }
}

/* Intestazione */
.head { grid-area: head; display: grid; gap: 14px; min-width: 0; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(3.1rem, 10vw, 6rem);
  line-height: 0.92;
  letter-spacing: 0.005em;
  text-transform: uppercase;
  text-wrap: balance;
}
.by { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.95rem; }
.avatar {
  flex: none;
  width: 40px; height: 40px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent-soft);
  color: var(--ink);
  font-weight: 700; font-size: 0.85rem;
}
.by strong { color: var(--ink); font-weight: 600; }

/* Foto con pettorale */
.hero { grid-area: hero; min-width: 0; }
.photo { position: relative; margin: 0 0 22px; }
.photo img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 5 / 4;
  object-fit: cover;
  object-position: 50% 35%;
  border-radius: 14px;
  background: var(--panel);
}
.bib {
  position: absolute;
  left: 16px;
  bottom: -22px;
  width: clamp(112px, 30%, 170px);
  background: var(--bib);
  color: var(--bib-ink);
  border-radius: 6px;
  transform: rotate(-3deg);
  box-shadow: 0 8px 22px rgba(8, 20, 15, 0.35);
  display: grid;
  text-align: center;
  overflow: hidden;
}
.bib-top {
  padding: 9px 8px 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
}
.bib-num {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(4.2rem, 15vw, 6.6rem);
  line-height: 0.85;
  padding-block: 8px 6px;
  letter-spacing: -0.01em;
}
.bib-bottom {
  background: var(--accent);
  color: #1A0A12;
  padding: 5px 6px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 0.82rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.pin {
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--panel);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
}
.pin.a { top: 6px; left: 6px; }
.pin.b { top: 6px; right: 6px; }

/* Storia */
.story { grid-area: story; min-width: 0; max-width: 62ch; }
h2 {
  margin: 0 0 14px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.9rem;
  line-height: 1;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.story p { margin: 0 0 1em; }
.story p:last-child { margin-bottom: 0; }
.sign { color: var(--muted); }

/* Scheda contributi */
.pay-col { grid-area: pay; min-width: 0; }
.pay {
  align-self: start;
  position: sticky;
  top: calc(16px + env(safe-area-inset-top, 0px));
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 24px 22px;
  display: grid;
  gap: 18px;
}
.raised { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.raised .amount {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 3.6rem;
  line-height: 0.9;
  font-variant-numeric: tabular-nums;
}
.raised .goal { color: var(--muted); font-size: 0.98rem; }
.meter { height: 14px; background: var(--line); border-radius: 7px; overflow: hidden; }
.meter-fill { height: 100%; background: var(--accent); border-radius: 7px 0 0 7px; box-shadow: inset -3px 0 0 var(--ink); }
.scale { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; color: var(--muted); font-size: 0.82rem; letter-spacing: 0.04em; text-transform: uppercase; }
.base-note { margin: 0; color: var(--muted); font-size: 0.93rem; }

.pay h2 { font-size: 1.5rem; margin: 0; padding-top: 18px; border-top: 1px solid var(--line); }
.lead { margin: -6px 0 0; font-size: 0.96rem; color: var(--muted); }

.field { display: grid; gap: 6px; min-width: 0; }
.label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.value { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.value.name, .value.cause { font-weight: 600; }
.value.iban {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 1.12rem;
  line-height: 1.45;
  letter-spacing: 0.02em;
  padding: 12px 14px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.btn {
  appearance: none;
  min-height: 44px;
  padding: 10px 18px;
  border-radius: 10px;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font: 600 0.95rem var(--font-body);
  cursor: pointer;
  transition: background-color 0.15s, color 0.15s;
}
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); width: 100%; font-size: 1rem; }
.btn.primary:hover { background: var(--btn-bg); filter: brightness(1.12); }
.btn.is-done { background: var(--accent); color: #1A0A12; border-color: var(--accent); }
.btn:not(.primary) { min-width: 88px; }
.check { margin: 0; padding: 12px 14px; background: var(--accent-soft); border-radius: 10px; font-size: 0.92rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Contributi */
.donors { grid-area: donors; min-width: 0; max-width: 62ch; }
.donor { display: flex; align-items: center; gap: 14px; padding-block: 14px; border-top: 1px solid var(--line); }
.donor:last-child { border-bottom: 1px solid var(--line); }
.donor .who { min-width: 0; flex: 1; }
.donor .who strong { display: block; font-weight: 600; }
.donor .who span { color: var(--muted); font-size: 0.9rem; }
.donor .sum { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; }

.foot { grid-area: foot; color: var(--muted); font-size: 0.88rem; border-top: 1px solid var(--line); padding-top: 18px; }
.foot p { margin: 0; }

@media (max-width: 879px) {
  .pay { position: static; }
}
@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
}

/* Metodi di pagamento */
.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; text-align: center; }
.method-group { display: grid; gap: 14px; min-width: 0; padding-top: 18px; border-top: 1px solid var(--line); }
.method {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.25rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.value { -webkit-user-select: all; user-select: all; }
.copy-hint { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 0.9rem; }
.btn.paypal, .btn.paypal:hover { background: #0B5FD0; border-color: #0B5FD0; color: #FFFFFF; filter: none; }
.btn.paypal:hover { background: #0A52B3; border-color: #0A52B3; }
.hint { margin: 0; color: var(--muted); font-size: 0.88rem; font-family: var(--font-mono); overflow-wrap: anywhere; }
.empty { margin: 0; padding-block: 14px; color: var(--muted); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.bib { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

/* Gestione conta (solo proprietario) */
.adm-back {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  background: rgba(8, 16, 12, 0.62);
  overflow: auto;
}
.adm-card {
  width: min(100%, 520px); max-height: 100%; overflow: auto;
  display: grid; gap: 16px; padding: 22px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 16px;
}
.adm-card h2 { margin: 0; padding: 0; border: 0; }
.adm-total { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.adm-list { list-style: none; margin: 0; padding: 0; display: grid; }
.adm-list li { display: flex; align-items: center; gap: 10px; padding-block: 8px; border-top: 1px solid var(--line); }
.adm-who { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.adm-sum { font-weight: 600; font-variant-numeric: tabular-nums; }
.adm-form { display: grid; gap: 12px; }
.adm-grid { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 10px; }
.adm-f { display: grid; gap: 6px; min-width: 0; }
.in {
  width: 100%; min-height: 44px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--ink);
  font: 500 16px var(--font-body);
}
.adm-check { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; }
.adm-check input { width: 20px; height: 20px; accent-color: var(--accent); }
.msg { margin: 0; min-height: 1.4em; font-size: 0.92rem; color: var(--muted); }
.adm-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
.adm-actions .btn.primary { width: auto; }
.btn.small { min-height: 36px; min-width: 0; padding: 6px 12px; font-size: 0.88rem; }
.btn:disabled { opacity: 0.55; cursor: default; }

html { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
body { margin: 0; }
.adm-gh { display: grid; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.adm-more { display: grid; gap: 12px; font-size: 0.92rem; }
.adm-more summary { cursor: pointer; color: var(--muted); }
.adm-more .adm-f { margin-top: 12px; }
.gallery { grid-area: gallery; min-width: 0; }
.shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.shot { padding: 0; border: 0; background: var(--panel); border-radius: 10px; overflow: hidden; cursor: zoom-in; aspect-ratio: 1; }
.shot img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s; }
.shot:hover img { transform: scale(1.04); }
@media (min-width: 560px) { .shots { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.lb { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(8, 16, 12, 0.88); cursor: zoom-out; }
.lb img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }
.lb button { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); min-height: 44px; padding: 8px 16px; border: 0; border-radius: 10px; background: #fff; color: #13211C; font: 600 0.95rem var(--font-body); cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .shot img { transition: none; } }
.adm-note { margin: 0; color: var(--muted); font-size: 0.85rem; }
</style>
</head>

<script>
(function () {
  var PAYPAL = 'https://www.paypal.me/cristiancrotti9';

  var state = JSON.parse(document.getElementById('state').textContent);
  var app = document.getElementById('app');

  /* ---------- utilità ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmt(n) {
    var x = Math.round(Number(n) * 100) / 100;
    var parts = Math.abs(x).toFixed(x % 1 === 0 ? 0 : 2).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (x < 0 ? '-' : '') + parts.join(',') + ' €';
  }
  function total(s) { return s.entries.reduce(function (t, e) { return t + (Number(e.amount) || 0); }, 0); }
  function shownName(e) { return e.anon ? 'Anonimo' : e.name; }
  function initials(e) {
    if (e.anon) return 'A';
    var p = String(e.name).trim().split(/\s+/);
    return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
  }
  function parseAmount(v) {
    var t = String(v).replace(/[€\s]/g, '');
    if (t.indexOf(',') > -1) t = t.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
    var n = Number(t);
    return isFinite(n) ? Math.round(n * 100) / 100 : NaN;
  }

  /* ---------- pagina ---------- */
  function view(s) {
    var tot = total(s);
    var goal = Number(s.goal) || 0;
    var pct = goal > 0 ? Math.min(100, Math.round(tot / goal * 1000) / 10) : 0;
    var base = null;
    s.entries.forEach(function (e) { if (e.base && !base) base = e; });
    var baseNote = base
      ? 'Base di partenza offerta da ' + esc(String(base.name).split(' ')[0]) + '. Ogni contributo in più avvicina il traguardo.'
      : 'Ogni contributo in più avvicina il traguardo.';
    var donors = s.entries.length
      ? s.entries.slice().reverse().map(function (e) {
          return '<div class="donor">' +
            '<span class="avatar" aria-hidden="true">' + esc(initials(e)) + '</span>' +
            '<div class="who"><strong>' + esc(shownName(e)) + '</strong>' +
            (e.note ? '<span>' + esc(e.note) + '</span>' : '') + '</div>' +
            '<span class="sum">' + fmt(e.amount) + '</span></div>';
        }).join('')
      : '<p class="empty">Il primo contributo comparirà qui.</p>';

    return '' +
'<header class="head">' +
  '<h1>60esimo Pierino</h1>' +
  '<div class="by"><span class="avatar" aria-hidden="true">CC</span>' +
  '<span>Organizzata da <strong>Claudia</strong> e <strong>Cri</strong> · Rezzato</span></div>' +
'</header>' +

'<section class="hero" aria-label="Foto"><figure class="photo">' +
  '<img src="img/foto-1.jpg" width="1200" height="1593" alt="Un escursionista con zaino e fascia blu davanti a un lago alpino, con un rifugio e una cima rocciosa alle spalle">' +
  '<div class="bib" role="img" aria-label="Pettorale numero 60">' +
    '<span class="pin a"></span><span class="pin b"></span>' +
    '<div class="bib-top">Pierino</div><div class="bib-num">60</div><div class="bib-bottom">e-bike</div>' +
  '</div></figure></section>' +

'<section class="story"><h2>La storia</h2>' +
  '<p>Ciao a tutti!</p>' +
  '<p>Fra poco sarà il 60esimo compleanno di Pierino e io e Cri abbiamo pensato fosse carino organizzare una colletta per chi desidera contribuire al suo regalo.</p>' +
  '<p>Uno dei suoi desideri sarebbe avere una bicicletta elettrica (o a pedalata assistita per i più esperti).</p>' +
  '<p>Siamo coscienti dei prezzi di un regalo del genere e per questo l\'idea è di raccogliere una somma per poter contribuire anche solo parzialmente al suo acquisto, con una base di partenza offerta gentilmente da Flavia che rende più realizzabile l\'obiettivo.</p>' +
  '<p>Se vi fa piacere dunque, potete contribuire con qualsiasi somma, anche in modo anonimo: basta scriverlo nella causale del bonifico o nel messaggio di PayPal.</p>' +
  '<p>Grazie in anticipo!</p>' +
  '<p class="sign">Un abbraccio,<br>Claudia e Cristian :)</p></section>' +

'<div class="pay-col"><aside class="pay" aria-label="Come contribuire">' +
  '<div><div class="raised"><span class="amount">' + fmt(tot) + '</span>' +
  '<span class="goal">di ' + fmt(goal) + ' di obiettivo</span></div></div>' +
  '<div><div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="' + goal + '" aria-valuenow="' + Math.min(tot, goal) + '" aria-label="' + esc(fmt(tot)) + ' su ' + esc(fmt(goal)) + '">' +
  '<div class="meter-fill" style="width:' + pct + '%"></div></div>' +
  '<div class="scale"><span>Partenza</span><span>Traguardo ' + fmt(goal) + '</span></div></div>' +
  '<p class="base-note">' + baseNote + '</p>' +

  '<h2>Come contribuire</h2>' +
  '<p class="lead">Scegli il bonifico o PayPal, con l\'importo che preferisci.</p>' +

  '<section class="method-group"><h3 class="method">Bonifico</h3>' +
    '<div class="field"><span class="label">IBAN</span>' +
      '<p class="value iban" id="iban-text">IT90 P036 6901 6004 3505 0827 930</p>' +
      '<button class="btn primary" type="button" data-copy="IT90P0366901600435050827930" data-target="iban-text">Copia IBAN</button></div>' +
    '<div class="field"><span class="label">Intestatario</span><div class="row">' +
      '<p class="value name" id="name-text">Cristian Crotti</p>' +
      '<button class="btn" type="button" data-copy="Cristian Crotti" data-target="name-text">Copia</button></div></div>' +
    '<div class="field"><span class="label">Causale suggerita</span><div class="row">' +
      '<p class="value cause" id="cause-text">Regalo 60 anni Pierino</p>' +
      '<button class="btn" type="button" data-copy="Regalo 60 anni Pierino" data-target="cause-text">Copia</button></div></div>' +
    '<p class="copy-hint" id="copy-hint" role="status" hidden></p>' +
    '<p class="check">Prima di confermare il bonifico, controlla che l\'intestatario sia Cristian Crotti.</p>' +
  '</section>' +

  '<section class="method-group"><h3 class="method">PayPal</h3>' +
    '<a class="btn primary paypal" href="' + PAYPAL + '" target="_blank" rel="noopener noreferrer">Contribuisci con PayPal</a>' +
    '<p class="hint">paypal.me/cristiancrotti9</p>' +
  '</section>' +
'</aside></div>' +

'<section class="gallery" aria-label="Altre foto"><h2>Qualche foto</h2><div class="shots"><button class="shot" type="button" data-full="img/foto-2.jpg" aria-label="Ingrandisci: Sugli sci in montagna, con lo zaino rosso, in una vecchia foto"><img src="img/foto-2.jpg" alt="Sugli sci in montagna, con lo zaino rosso, in una vecchia foto" loading="lazy" decoding="async"></button><button class="shot" type="button" data-full="img/foto-3.jpg" aria-label="Ingrandisci: La testa e le braccia nella gogna di legno di Gardaland"><img src="img/foto-3.jpg" alt="La testa e le braccia nella gogna di legno di Gardaland" loading="lazy" decoding="async"></button><button class="shot" type="button" data-full="img/foto-4.jpg" aria-label="Ingrandisci: In una forra con il casco, appeso a una via ferrata"><img src="img/foto-4.jpg" alt="In una forra con il casco, appeso a una via ferrata" loading="lazy" decoding="async"></button><button class="shot" type="button" data-full="img/foto-5.jpg" aria-label="Ingrandisci: Una vecchia foto di famiglia con un neonato, una bambina e un gatto"><img src="img/foto-5.jpg" alt="Una vecchia foto di famiglia con un neonato, una bambina e un gatto" loading="lazy" decoding="async"></button><button class="shot" type="button" data-full="img/foto-6.jpg" aria-label="Ingrandisci: Con una parrucca viola, sorridente"><img src="img/foto-6.jpg" alt="Con una parrucca viola, sorridente" loading="lazy" decoding="async"></button><button class="shot" type="button" data-full="img/foto-7.jpg" aria-label="Ingrandisci: Con le stelline scintillanti davanti a una crostata con le candeline"><img src="img/foto-7.jpg" alt="Con le stelline scintillanti davanti a una crostata con le candeline" loading="lazy" decoding="async"></button><button class="shot" type="button" data-full="img/foto-8.jpg" aria-label="Ingrandisci: Addormentato sul divano con un colbacco peloso"><img src="img/foto-8.jpg" alt="Addormentato sul divano con un colbacco peloso" loading="lazy" decoding="async"></button><button class="shot" type="button" data-full="img/foto-9.jpg" aria-label="Ingrandisci: Allo stadio che guarda con un binocolo"><img src="img/foto-9.jpg" alt="Allo stadio che guarda con un binocolo" loading="lazy" decoding="async"></button><button class="shot" type="button" data-full="img/foto-10.jpg" aria-label="Ingrandisci: Con la maglietta nera con la scritta concarena"><img src="img/foto-10.jpg" alt="Con la maglietta nera con la scritta concarena" loading="lazy" decoding="async"></button><button class="shot" type="button" data-full="img/foto-11.jpg" aria-label="Ingrandisci: Mentre tende un arco davanti a una parete di roccia rossa"><img src="img/foto-11.jpg" alt="Mentre tende un arco davanti a una parete di roccia rossa" loading="lazy" decoding="async"></button><button class="shot" type="button" data-full="img/foto-12.jpg" aria-label="Ingrandisci: Da giovane, con i pugni alzati, in una vecchia foto"><img src="img/foto-12.jpg" alt="Da giovane, con i pugni alzati, in una vecchia foto" loading="lazy" decoding="async"></button><button class="shot" type="button" data-full="img/foto-13.jpg" aria-label="Ingrandisci: Su una barca con un calice di vino in mano"><img src="img/foto-13.jpg" alt="Su una barca con un calice di vino in mano" loading="lazy" decoding="async"></button></div></section>' +

'<section class="donors"><h2>Contributi · ' + s.entries.length + '</h2>' + donors + '</section>' +

'<footer class="foot"><p>Pagina creata per gli amici e la famiglia di Pierino. Il contributo arriva direttamente a Cristian Crotti. Il totale è aggiornato a mano dagli organizzatori.</p></footer>';
  }

  function render() { app.innerHTML = view(state); }

  /* ---------- copia ---------- */
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.setAttribute('aria-hidden', 'true');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;font-size:16px;';
    document.body.appendChild(ta);
    var ok = false;
    try {
      ta.focus({ preventScroll: true });
      ta.select();
      ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
    } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  function copyText(text) {
    return new Promise(function (resolve) {
      if (legacyCopy(text)) { resolve(true); return; }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { resolve(true); }, function () { resolve(false); });
          return;
        }
      } catch (e) {}
      resolve(false);
    });
  }
  function selectNode(node) {
    try {
      var range = document.createRange();
      range.selectNodeContents(node);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    } catch (e) {}
  }
  document.addEventListener('click', function (ev) {
    var btn = ev.target.closest && ev.target.closest('[data-copy]');
    if (!btn) return;
    var target = document.getElementById(btn.getAttribute('data-target'));
    var hint = document.getElementById('copy-hint');
    copyText(btn.getAttribute('data-copy')).then(function (ok) {
      var label = btn.getAttribute('data-label') || btn.textContent;
      btn.setAttribute('data-label', label);
      btn.textContent = ok ? 'Copiato' : 'Selezionato';
      btn.classList.toggle('is-done', ok);
      if (!ok && target) selectNode(target);
      if (hint) {
        hint.hidden = ok;
        hint.textContent = ok ? '' : 'Il tuo browser non permette la copia automatica. Il testo è selezionato: tieni premuto e scegli Copia.';
      }
      setTimeout(function () {
        btn.textContent = label;
        btn.classList.remove('is-done');
      }, 2200);
    });
  });

  /* ---------- dati: data.json nel repository ---------- */
  var DATA_FILE = 'data.json';
  function validState(d) {
    return d && typeof d === 'object' && Array.isArray(d.entries) && isFinite(Number(d.goal));
  }
  function loadState() {
    return fetch(DATA_FILE + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (d) { if (validState(d)) state = d; })
      .catch(function () {})
      .then(render);
  }
  loadState();

  /* ---------- foto ingrandite ---------- */
  var lb = null;
  function closeLb() { if (lb) { lb.remove(); lb = null; document.removeEventListener('keydown', lbKey); } }
  function lbKey(ev) { if (ev.key === 'Escape') closeLb(); }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest && ev.target.closest('.shot');
    if (!b) return;
    var thumb = b.querySelector('img');
    lb = document.createElement('div');
    lb.className = 'lb';
    var im = document.createElement('img');
    im.src = b.getAttribute('data-full');
    im.alt = thumb ? thumb.alt : '';
    var x = document.createElement('button');
    x.type = 'button'; x.textContent = 'Chiudi';
    lb.appendChild(im); lb.appendChild(x);
    lb.addEventListener('click', closeLb);
    document.body.appendChild(lb);
    document.addEventListener('keydown', lbKey);
  });

  /* ---------- zona segreta: 5 tocchi sul pettorale (o #gestione) ---------- */
  var ls = {
    get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var tapN = 0, tapT = 0;
  document.addEventListener('click', function (ev) {
    if (!(ev.target.closest && ev.target.closest('.bib'))) return;
    var now = Date.now();
    tapN = (now - tapT < 700) ? tapN + 1 : 1;
    tapT = now;
    if (tapN >= 5) { tapN = 0; openAdmin(); }
  });
  if (location.hash === '#gestione') setTimeout(openAdmin, 400);

  function guessRepo() {
    var h = location.hostname, m = h.match(/^([^.]+)\.github\.io$/);
    if (!m) return '';
    var seg = location.pathname.split('/')[1] || '';
    return m[1] + '/' + (seg && seg.indexOf('.') < 0 ? seg : h);
  }
  function b64(str) { return btoa(unescape(encodeURIComponent(str))); }

  async function saveToGithub(data, cfg, attempt) {
    var base = 'https://api.github.com/repos/' + cfg.repo + '/contents/' + cfg.path;
    var h = { Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json' };
    var g = await fetch(base + (cfg.branch ? '?ref=' + encodeURIComponent(cfg.branch) : ''), { headers: h, cache: 'no-store' });
    var sha;
    if (g.status === 200) sha = (await g.json()).sha;
    else if (g.status !== 404) throw { status: g.status };
    var body = { message: 'Aggiorna la conta', content: b64(JSON.stringify(data, null, 2) + '\n') };
    if (sha) body.sha = sha;
    if (cfg.branch) body.branch = cfg.branch;
    var headers = { 'Content-Type': 'application/json' };
    for (var k in h) headers[k] = h[k];
    var p = await fetch(base, { method: 'PUT', headers: headers, body: JSON.stringify(body) });
    if (!p.ok) {
      if (p.status === 409 && !attempt) return saveToGithub(data, cfg, 1);
      throw { status: p.status };
    }
  }
  function errorText(e) {
    var s = e && e.status;
    if (s === 401) return 'Token non valido o scaduto.';
    if (s === 403 || s === 404) return 'Nessun accesso a questo repository. Controlla il nome (proprietario/repository) e che il token abbia il permesso Contents in lettura e scrittura.';
    if (s === 409 || s === 422) return 'GitHub ha rifiutato il salvataggio (ramo o file sbagliato, oppure modifica in conflitto). Riprova.';
    if (!s) return 'Nessuna connessione a GitHub.';
    return 'Salvataggio non riuscito (errore ' + s + ').';
  }

  var panel = null, draft = null;

  function openAdmin() {
    if (panel) return;
    draft = JSON.parse(JSON.stringify(state));
    panel = document.createElement('div');
    panel.className = 'adm-back';
    panel.innerHTML =
      '<div class="adm-card" role="dialog" aria-modal="true" aria-labelledby="adm-title">' +
        '<h2 id="adm-title">Gestione conta</h2>' +
        '<p class="adm-total" id="adm-total"></p>' +
        '<ul class="adm-list" id="adm-list"></ul>' +
        '<form class="adm-form" id="adm-form" autocomplete="off">' +
          '<div class="adm-grid">' +
            '<label class="adm-f"><span class="label">Nome</span><input class="in" id="adm-name" type="text" maxlength="60"></label>' +
            '<label class="adm-f"><span class="label">Importo €</span><input class="in" id="adm-amount" type="text" inputmode="decimal"></label>' +
          '</div>' +
          '<label class="adm-check"><input id="adm-anon" type="checkbox"> Anonimo (il nome non viene salvato)</label>' +
          '<button class="btn" type="submit">Aggiungi contributo</button>' +
        '</form>' +
        '<label class="adm-f"><span class="label">Obiettivo €</span><input class="in" id="adm-goal" type="text" inputmode="decimal"></label>' +
        '<div class="adm-gh">' +
          '<label class="adm-f"><span class="label">Repository GitHub (proprietario/nome)</span><input class="in" id="adm-repo" type="text" autocapitalize="off" spellcheck="false"></label>' +
          '<label class="adm-f"><span class="label">Token GitHub</span><input class="in" id="adm-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label>' +
          '<details class="adm-more"><summary>Opzioni avanzate</summary>' +
            '<label class="adm-f"><span class="label">Ramo (vuoto = quello predefinito)</span><input class="in" id="adm-branch" type="text" autocapitalize="off" spellcheck="false"></label>' +
            '<label class="adm-f"><span class="label">File dei dati</span><input class="in" id="adm-path" type="text" autocapitalize="off" spellcheck="false"></label>' +
          '</details>' +
          '<p class="adm-note">Il token resta solo in questo browser e serve per salvare. Senza il token nessuno può cambiare la conta.</p>' +
        '</div>' +
        '<p class="msg" id="adm-msg" role="status"></p>' +
        '<div class="adm-actions"><button class="btn" type="button" id="adm-close">Chiudi</button>' +
        '<button class="btn primary" type="button" id="adm-save">Salva su GitHub</button></div>' +
      '</div>';
    document.body.appendChild(panel);

    var $ = function (id) { return document.getElementById(id); };
    $('adm-goal').value = String(draft.goal).replace('.', ',');
    $('adm-repo').value = ls.get('gh-repo') || guessRepo();
    $('adm-token').value = ls.get('gh-token');
    $('adm-branch').value = ls.get('gh-branch');
    $('adm-path').value = ls.get('gh-path') || DATA_FILE;

    function msg(t) { $('adm-msg').textContent = t || ''; }
    function drawList() {
      $('adm-total').textContent = 'Totale ' + fmt(total(draft)) + ' su ' + fmt(draft.goal);
      var ul = $('adm-list');
      ul.innerHTML = '';
      draft.entries.forEach(function (e) {
        var li = document.createElement('li');
        var who = document.createElement('span'); who.className = 'adm-who'; who.textContent = shownName(e);
        var sum = document.createElement('span'); sum.className = 'adm-sum'; sum.textContent = fmt(e.amount);
        var del = document.createElement('button'); del.type = 'button'; del.className = 'btn small'; del.textContent = 'Rimuovi';
        del.setAttribute('aria-label', 'Rimuovi ' + shownName(e));
        del.addEventListener('click', function () {
          draft.entries = draft.entries.filter(function (x) { return x.id !== e.id; });
          drawList();
        });
        li.appendChild(who); li.appendChild(sum); li.appendChild(del);
        ul.appendChild(li);
      });
    }
    drawList();

    function close() {
      document.removeEventListener('keydown', onKey);
      panel.remove(); panel = null;
    }
    function onKey(ev) { if (ev.key === 'Escape') close(); }
    document.addEventListener('keydown', onKey);
    $('adm-close').addEventListener('click', close);

    $('adm-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var anon = $('adm-anon').checked;
      var name = $('adm-name').value.trim();
      var amount = parseAmount($('adm-amount').value);
      if (!(amount > 0)) { msg('Scrivi un importo maggiore di zero.'); return; }
      if (!anon && !name) { msg('Scrivi un nome oppure spunta Anonimo.'); return; }
      draft.entries.push({ id: 'e' + Date.now(), name: anon ? '' : name, anon: anon, amount: amount });
      $('adm-name').value = ''; $('adm-amount').value = ''; $('adm-anon').checked = false;
      msg('Aggiunto. Ora premi Salva su GitHub.');
      drawList();
      $('adm-name').focus();
    });

    $('adm-save').addEventListener('click', async function () {
      var goal = parseAmount($('adm-goal').value);
      var cfg = {
        repo: $('adm-repo').value.trim(),
        token: $('adm-token').value.trim(),
        branch: $('adm-branch').value.trim(),
        path: $('adm-path').value.trim().replace(/^\/+/, '') || DATA_FILE
      };
      if (!(goal > 0)) { msg('L\'obiettivo deve essere un importo maggiore di zero.'); return; }
      if (!/^[\w.-]+\/[\w.-]+$/.test(cfg.repo)) { msg('Scrivi il repository come proprietario/nome, ad esempio mario/pierino.'); return; }
      if (!cfg.token) { msg('Incolla il token GitHub per salvare.'); return; }
      draft.goal = goal;
      var btn = $('adm-save');
      btn.disabled = true; msg('Salvataggio in corso…');
      try {
        await saveToGithub(draft, cfg);
        ls.set('gh-repo', cfg.repo); ls.set('gh-token', cfg.token);
        ls.set('gh-branch', cfg.branch); ls.set('gh-path', cfg.path);
        state = JSON.parse(JSON.stringify(draft));
        render();
        drawList();
        msg('Salvato. Per gli altri la pagina si aggiorna tra circa un minuto.');
      } catch (e) {
        msg(errorText(e));
      }
      btn.disabled = false;
    });
    $('adm-name').focus();
  }
})();
</script>
